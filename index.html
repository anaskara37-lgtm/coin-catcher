<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صيد العملات</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:12px;background:linear-gradient(#2C5364,#0F2027);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center}
h1{margin:6px 0;font-size:1.7rem}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin:8px 0;font-size:1.05rem}
canvas{display:block;margin:auto;width:min(92vw,340px);height:auto;aspect-ratio:3/4;touch-action:none;border-radius:16px;box-shadow:0 0 20px rgba(255,213,79,.35)}
#msg{min-height:1.6em;margin:8px 0;color:#FFD54F;font-weight:bold}
.btns{direction:ltr}
button{font-size:1.5rem;padding:10px 28px;margin:0 6px;border:0;border-radius:14px;background:#FFD54F;color:#1B1B1B;cursor:pointer}
button:active{transform:scale(.94)}
</style>
</head>
<body>
<h1>🪙 صيد العملات</h1>
<div class="bar">
  <span>المستوى: <b id="lv">1</b></span>
  <span>النقاط: <b id="sc">0</b></span>
  <span>أحسن نتيجة: <b id="best">0</b></span>
  <span id="hearts">❤️❤️❤️</span>
</div>
<canvas id="c" width="300" height="400"></canvas>
<p id="msg"></p>
<div class="btns">
  <button onclick="go(-40)">⬅️</button>
  <button onclick="go(40)">➡️</button>
</div>

<script>
let c = document.getElementById("c");
let g = c.getContext("2d");
let px, items, sc, lives, frame, flash, magnetT;
let state = "menu", overAt = 0, best = 0;
try { best = Number(localStorage.getItem("cbest")) || 0; } catch (e) {}

let themes = [
  ["#1F3A5F", "#0B1A2E", "🌙", "#FFFFFF"],
  ["#2E4A2F", "#0F1F10", "🌕", "#C6F36B"],
  ["#5A2E5F", "#1F0B2E", "🪐", "#FFB3E6"],
  ["#5F3A1F", "#2E1A0B", "☀️", "#FFD08A"],
  ["#1F5F5A", "#0B2E2B", "🌠", "#9FFFF0"]
];

let stars = [];
for (let i = 0; i < 40; i++) {
  stars.push({ x: Math.random() * 300, y: Math.random() * 400, r: Math.random() * 1.5 + 0.8, v: Math.random() * 0.5 + 0.15 });
}

function level() {
  return Math.floor(sc / 10) + 1;
}

let ac;
function beep(freq, dur, type) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    let o = ac.createOscillator();
    let v = ac.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    v.gain.setValueAtTime(0.15, ac.currentTime);
    v.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(v);
    v.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch (e) {}
}

function reset() {
  px = 125;
  items = [];
  sc = 0;
  lives = 3;
  frame = 0;
  flash = 0;
  magnetT = 0;
}

function begin() {
  reset();
  state = "play";
  beep(660, 0.08, "square");
  show("جمع 🪙 وتجنب 💣");
}

function tryStart() {
  if (state === "play") return;
  if (state === "over" && Date.now() - overAt < 600) return;
  begin();
}

function show(m) {
  document.getElementById("lv").textContent = level();
  document.getElementById("sc").textContent = sc;
  document.getElementById("best").textContent = best;
  document.getElementById("hearts").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
  document.getElementById("msg").textContent = m || "";
}

function go(d) {
  if (state !== "play") { tryStart(); return; }
  px = Math.max(0, Math.min(250, px + d));
}

function moveTo(clientX) {
  let r = c.getBoundingClientRect();
  let x = (clientX - r.left) * (300 / r.width);
  px = Math.max(0, Math.min(250, x - 21));
}

c.addEventListener("touchstart", function (e) {
  e.preventDefault();
  if (state !== "play") tryStart();
  else moveTo(e.touches[0].clientX);
}, { passive: false });

c.addEventListener("touchmove", function (e) {
  e.preventDefault();
  if (state === "play") moveTo(e.touches[0].clientX);
}, { passive: false });

c.addEventListener("click", function () {
  tryStart();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") go(-30);
  if (e.key === "ArrowRight") go(30);
  if (e.key === "Enter" || e.key === " ") tryStart();
});

function end() {
  state = "over";
  overAt = Date.now();
  beep(110, 0.6, "sawtooth");
  if (sc > best) {
    best = sc;
    try { localStorage.setItem("cbest", String(best)); } catch (e) {}
  }
  show("خسرتي فالمستوى " + level() + "! كليكي على اللوحة باش تعاود");
}

function play() {
  let speed = 1.5 + level() * 0.6;

  if (frame % Math.max(18, 40 - level() * 3) === 0) {
    let r = Math.random();
    let k = r < 0.28 ? "bomb" : r < 0.33 ? "magnet" : r > 0.92 ? "gold" : "coin";
    items.push({ x: Math.random() * 270, y: -24, k: k });
  }

  if (magnetT > 0) {
    magnetT--;
    items.forEach(function (it) {
      if (it.k === "coin" || it.k === "gold") {
        it.x = it.x + (px + 11 - it.x) * 0.07;
      }
    });
  }

  items.forEach(function (it) { it.y = it.y + speed; });

  items = items.filter(function (it) {
    let caught = it.y + 24 >= 365 && it.y <= 392 && it.x + 24 > px && it.x < px + 46;
    if (caught) {
      if (it.k === "bomb") {
        lives--;
        beep(150, 0.3, "sawtooth");
        show();
      } else if (it.k === "magnet") {
        magnetT = 400;
        beep(1000, 0.25, "triangle");
        show("مغناطيس! 🧲");
      } else {
        let before = level();
        sc = sc + (it.k === "gold" ? 5 : 1);
        if (level() > before) flash = 25;
        beep(it.k === "gold" ? 1400 : 880, it.k === "gold" ? 0.25 : 0.12, "square");
        show(level() > before ? "مستوى جديد " + level() + "! 🔥" : (it.k === "gold" ? "+5 ⭐" : ""));
      }
      return false;
    }
    return it.y < 400;
  });

  if (lives <= 0) end();
}

function step() {
  frame++;
  if (flash > 0) flash--;

  stars.forEach(function (s) {
    s.y = s.y + s.v;
    if (s.y > 400) {
      s.y = 0;
      s.x = Math.random() * 300;
    }
  });

  if (state === "play") play();
  draw();
}

function draw() {
  g.direction = "ltr";
  g.textAlign = "left";
  let th = themes[(level() - 1) % themes.length];
  let bg = g.createLinearGradient(0, 0, 0, 400);
  bg.addColorStop(0, th[0]);
  bg.addColorStop(1, th[1]);
  g.globalAlpha = 1;
  g.fillStyle = bg;
  g.fillRect(0, 0, 300, 400);

  g.fillStyle = th[3];
  stars.forEach(function (s) {
    g.globalAlpha = 0.35 + 0.6 * Math.abs(Math.sin(frame / 25 + s.x));
    g.beginPath();
    g.arc(s.x, s.y, s.r, 0, 7);
    g.fill();
  });

  g.globalAlpha = 0.18;
  g.fillStyle = "#FFFFFF";
  g.fillRect(0, 396, 300, 4);

  g.globalAlpha = 1;
  g.fillStyle = "#FFFFFF";
  g.font = "34px serif";
  g.fillText(th[2], 245, 45);

  g.font = "28px serif";
  items.forEach(function (it) {
    let e = it.k === "bomb" ? "💣" : it.k === "magnet" ? "🧲" : it.k === "gold" ? "⭐" : "🪙";
    g.fillText(e, it.x, it.y + 24);
  });

  g.font = "42px serif";
  g.fillText("🧺", px, 395);

  if (magnetT > 0) {
    g.font = "20px serif";
    g.fillText("🧲", 8, 26);
    g.fillStyle = "#FFD54F";
    g.fillRect(36, 14, magnetT / 400 * 70, 8);
  }

  if (flash > 0) {
    g.globalAlpha = flash / 50;
    g.fillStyle = "#FFFFFF";
    g.fillRect(0, 0, 300, 400);
    g.globalAlpha = 1;
  }

  if (state === "menu") {
    g.fillStyle = "rgba(0,0,0,0.6)";
    g.fillRect(0, 0, 300, 400);
    g.textAlign = "center";
    g.fillStyle = "#FFFFFF";
    g.font = "bold 30px Arial";
    g.fillText("صيد العملات", 150, 110);
    g.font = "22px Arial";
    g.fillText("🪙 +1     ⭐ +5", 150, 175);
    g.fillText("🧲 مغناطيس", 150, 215);
    g.fillText("💣 تجنبها", 150, 255);
    g.fillStyle = "#FFD54F";
    g.font = "bold 24px Arial";
    g.fillText("اضغط للبدء", 150, 340);
  }
}

reset();
show("اضغط على اللوحة للبدء");
setInterval(step, 20);
</script>
</body>
</html>
